name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, windows]
    env:
      PORT: 6002
      APP_DIR: D:\OA文件\班组排产系统\班组排产系统

    steps:
      - name: Stop old process
        shell: powershell
        run: |
          $port = $env:PORT
          $line = netstat -ano | Select-String ":$port" | Select-String "LISTENING"
          if ($line) {
            $parts = $line -split '\s+' | Where-Object { $_ }
            $procId = $parts[-1]
            Stop-Process -Id $procId -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 3
          }

      - name: Git pull
        shell: powershell
        run: |
          $git = "D:\Program Files\Git\bin\git.exe"
          Set-Location $env:APP_DIR

          if (-not (Test-Path "$env:APP_DIR\.git")) {
            & $git init
            & $git remote add origin http://10.6.201.11:3001/magj/ProductionSchedulingSystem.git
          }

          & $git fetch origin
          if ($LASTEXITCODE -ne 0) {
            Write-Error "git fetch failed"
            exit 1
          }

          $ErrorActionPreference = "Continue"
          $localMainExists = $false
          try {
            $out = & $git rev-parse --verify main 2>&1
            if ($LASTEXITCODE -eq 0) { $localMainExists = $true }
          } catch {
            $localMainExists = $false
          }

          if ($localMainExists) {
            & $git checkout main
            # Backup database before reset
            $dbPath = "$env:APP_DIR\data\production.db"
            $dbBackup = "$env:APP_DIR\data\production.db.bak"
            if (Test-Path $dbPath) {
              Copy-Item $dbPath $dbBackup -Force
              Write-Host "Database backed up before reset"
            }
            & $git reset --hard origin/main
            # Only restore backup if git deleted the database (untracked file transition)
            # If git deployed a new database (tracked in this commit), keep the new one
            if (-not (Test-Path $dbPath) -and (Test-Path $dbBackup)) {
              Copy-Item $dbBackup $dbPath -Force
              Write-Host "Database restored (was deleted by reset)"
            }
            if (Test-Path $dbBackup) { Remove-Item $dbBackup -Force }
            Remove-Item "$env:APP_DIR\data\production.db-shm" -ErrorAction SilentlyContinue
            Remove-Item "$env:APP_DIR\data\production.db-wal" -ErrorAction SilentlyContinue
          } else {
            & $git config user.email "deploy@local"
            & $git config user.name "Deploy Bot"
            $status = & $git status --porcelain
            if ($status) {
              & $git add -A
              & $git commit -m "local initial files" --allow-empty
              & $git branch -M main
              & $git merge origin/main --allow-unrelated-histories -X theirs --no-edit
              if ($LASTEXITCODE -ne 0) {
                Write-Error "git merge failed, please resolve conflicts manually"
                exit 1
              }
            } else {
              & $git checkout -b main origin/main
            }
          }

      - name: Install dependencies
        shell: powershell
        run: |
          Set-Location $env:APP_DIR
          pip install -r requirements.txt

      - name: Start new process
        shell: powershell
        run: |
          $dir = $env:APP_DIR
          $port = $env:PORT
          $logFile = Join-Path $dir "server.log"
          $proc = Start-Process cmd -WorkingDirectory $dir -WindowStyle Hidden `
            -ArgumentList "/c python $dir\app.py > $logFile 2>&1" -PassThru
          Start-Sleep -Seconds 5
          if ($proc.HasExited) {
            Write-Error "Server exited with code $($proc.ExitCode)"
            Get-Content $logFile -ErrorAction SilentlyContinue | Write-Host
            exit 1
          }
          Write-Host "Server PID $($proc.Id) started on port $port"
