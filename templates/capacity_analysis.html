{% extends "base.html" %}
{% block content %}
<style>
.ca-wrap { display:flex; height:calc(100vh - 64px); }
.ca-left { width:25%; min-width:280px; border-right:1px solid #e2e8f0; background:#fff; display:flex; flex-direction:column; }
.ca-left .ca-search { display:flex; gap:6px; padding:12px; border-bottom:1px solid #eef2f7; }
.ca-left .ca-search input { flex:1; padding:7px 10px; border:1px solid #d1d5db; border-radius:6px; font-size:13px; }
.ca-left .ca-list { flex:1; overflow-y:auto; padding:6px 0; }
.ca-right { flex:1; display:flex; flex-direction:column; min-width:0; background:#fff; }
.ca-right .ca-head { padding:10px 16px; border-bottom:1px solid #eef2f7; font-size:14px; font-weight:600; color:#1e293b; }
.ca-right #chart-pane { flex:1; }
.product-item { border-bottom:1px solid #f1f5f9; }
.product-line { display:flex; align-items:center; gap:6px; padding:9px 12px; cursor:pointer; font-size:13px; color:#334155; }
.product-line:hover { background:#f8fafc; }
.product-line .arrow { width:14px; text-align:center; color:#94a3b8; font-size:11px; }
.product-line .pname { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.product-line .pcode { color:#94a3b8; font-size:12px; margin-right:4px; }
.process-list { display:none; background:#f8fafc; padding:4px 0 4px 30px; }
.process-list.open { display:block; }
.process-item { padding:7px 10px; font-size:13px; color:#475569; cursor:pointer; border-left:2px solid transparent; border-radius:0 6px 6px 0; }
.process-item:hover { background:#eef2ff; color:#2563eb; }
.process-item.active { background:#e0e7ff; border-left-color:#6366f1; color:#4338ca; font-weight:600; }
.ca-empty { padding:40px 16px; text-align:center; color:#94a3b8; font-size:13px; }
</style>
<div class="ca-wrap">
  <div class="ca-left">
    <div class="ca-search">
      <input type="text" id="ca-keyword" placeholder="搜索产品名称/编号" onkeydown="if(event.key==='Enter')searchProducts()">
      <button class="btn btn-primary" onclick="searchProducts()">搜索</button>
    </div>
    <div class="ca-list" id="ca-product-list">
      <div class="ca-empty">请输入关键词搜索产品</div>
    </div>
  </div>
  <div class="ca-right">
    <div class="ca-head" id="ca-head">选择左侧产品工序，查看产能节拍分析</div>
    <div id="chart-pane"></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
{% endblock %}
{% block scripts %}
<script>
var caChart = null;
var activePCB = null; // 当前选中的 (product_code|process)

function initChart(){
  var el = document.getElementById('chart-pane');
  if(window.echarts){
    caChart = echarts.init(el);
    showChartEmpty('请在左侧选择产品工序');
  } else {
    el.innerHTML = '<div class="ca-empty">图表库加载失败，请检查网络</div>';
  }
}
window.addEventListener('resize', function(){ if(caChart) caChart.resize(); });

function escH(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showChartEmpty(msg){
  if(caChart){
    caChart.dispose();
    caChart = null;
  }
  document.getElementById('chart-pane').innerHTML = '<div class="ca-empty">'+escH(msg)+'</div>';
  caChart = echarts.init(document.getElementById('chart-pane'));
}

function searchProducts(){
  var q = document.getElementById('ca-keyword').value.trim();
  var box = document.getElementById('ca-product-list');
  box.innerHTML = '<div class="ca-empty">加载中...</div>';
  fetch('/api/capacity-analysis/products?q=' + encodeURIComponent(q))
    .then(function(r){ return r.json(); })
    .then(function(resp){
      var data = resp.data || [];
      if(!data.length){
        box.innerHTML = '<div class="ca-empty">未找到产品</div>';
        return;
      }
      box.innerHTML = '';
      for(var i=0;i<data.length;i++){
        var it = data[i];
        var div = document.createElement('div');
        div.className = 'product-item';
        div.setAttribute('data-pc', it.product_code);
        div.innerHTML =
          '<div class="product-line" onclick="toggleProduct(this)">' +
            '<span class="arrow" id="arr-'+escH(it.product_code)+'">▸</span>' +
            '<span class="pname" title="'+escH(it.product_name)+'">'+escH(it.product_name||it.product_code)+'</span>' +
            '<span class="pcode">'+escH(it.product_code)+'</span>' +
          '</div>' +
          '<div class="process-list" id="pl-'+escH(it.product_code)+'"><div class="ca-empty" style="padding:14px;font-size:12px">加载工序...</div></div>';
        box.appendChild(div);
      }
    })
    .catch(function(){ box.innerHTML = '<div class="ca-empty">加载失败</div>'; });
}

function toggleProduct(line){
  var item = line.parentNode;
  var pc = item.getAttribute('data-pc');
  var pl = document.getElementById('pl-'+pc);
  var arrow = document.getElementById('arr-'+pc);
  var opened = pl.classList.contains('open');
  if(opened){
    pl.classList.remove('open');
    arrow.textContent = '▸';
    return;
  }
  pl.classList.add('open');
  arrow.textContent = '▾';
  if(pl.getAttribute('data-loaded')) return;
  fetch('/api/capacity-analysis/processes?product_code=' + encodeURIComponent(pc))
    .then(function(r){ return r.json(); })
    .then(function(resp){
      var procs = resp.data || [];
      pl.setAttribute('data-loaded','1');
      if(!procs.length){
        pl.innerHTML = '<div class="ca-empty" style="padding:10px;font-size:12px">无工艺路线工序</div>';
        return;
      }
      pl.innerHTML = '';
      for(var i=0;i<procs.length;i++){
        var p = document.createElement('div');
        p.className = 'process-item';
        p.textContent = procs[i];
        p.setAttribute('data-proc', procs[i]);
        p.onclick = function(){ selectProcess(pc, this.getAttribute('data-proc')); };
        pl.appendChild(p);
      }
    })
    .catch(function(){ pl.innerHTML = '<div class="ca-empty" style="padding:10px;font-size:12px">加载失败</div>'; });
}

function selectProcess(pc, process){
  activePCB = pc + '|' + process;
  document.querySelectorAll('.process-item').forEach(function(el){
    el.classList.remove('active');
  });
  var pl = document.getElementById('pl-'+pc);
  var targets = pl.querySelectorAll('.process-item');
  for(var i=0;i<targets.length;i++){
    if(targets[i].getAttribute('data-proc')===process){
      targets[i].classList.add('active');
    }
  }
  document.getElementById('ca-head').textContent = pc + ' · ' + process;
  showChartEmpty('加载中...');
  fetch('/api/capacity-analysis/chart?product_code='+encodeURIComponent(pc)+'&process='+encodeURIComponent(process))
    .then(function(r){ return r.json(); })
    .then(function(resp){
      var data = resp.data || [];
      if(!data.length){
        showChartEmpty('该工序暂无有效报工数据');
        return;
      }
      renderChart(data);
    })
    .catch(function(){ showChartEmpty('数据加载失败'); });
}

function renderChart(data){
  var names = [];
  var takts = [];
  var tooltip = [];
  for(var i=0;i<data.length;i++){
    var d = data[i];
    names.push(d.operator || '(未填)');
    takts.push(d.takt);
    tooltip.push({
      product_code:d.product_code, product_name:d.product_name, process_name:d.process_name,
      operator:d.operator, order_no:d.order_no, report_qty:d.report_qty, good_qty:d.good_qty,
      bad_qty:d.bad_qty, report_hours:d.report_hours, equipment:d.equipment,
      start_time:d.start_time, end_time:d.end_time, frame_qty:d.frame_qty, takt:d.takt
    });
  }
  if(!caChart){ caChart = echarts.init(document.getElementById('chart-pane')); }
  var option = {
    tooltip: {
      trigger:'item',
      formatter: function(params){
        var t = tooltip[params.dataIndex];
        if(!t) return '';
        var bad = (t.bad_qty||0) ? '<div style="color:#dc2626">不良：'+t.bad_qty+'</div>' : '<div>不良：0</div>';
        var html = '<div style="font-weight:600;margin-bottom:4px">'+escH(t.operator||'(未填)')+' 报工明细</div>';
        html += '<div style="color:#334155;margin-bottom:2px">产品：'+escH(t.product_name||t.product_code)+' · <span style="color:#64748b">'+escH(t.process_name)+'</span></div>';
        html += '<div style="color:#334155;margin-bottom:2px">工单号：'+escH(t.order_no||'-')+'</div>';
        html += '<div style="color:#334155;margin-bottom:2px">设备：'+escH(t.equipment||'-')+'</div>';
        html += '<div style="color:#334155;margin-bottom:2px">数量：'+t.report_qty + '　'+'合格：'+t.good_qty+'　'+bad;
        html += '<div style="color:#334155;margin-bottom:2px">工时：'+t.report_hours+' h'+(t.frame_qty?'　装框量：'+t.frame_qty:'')+'</div>';
        html += '<div style="color:#334155;margin-bottom:2px">时间：'+escH(t.start_time||'-')+' 至 '+escH(t.end_time||'-')+'</div>';
        html += '<div style="color:#dc2626;font-weight:600;margin-top:2px">节拍：'+t.takt+' s</div>';
        return html;
      },
      backgroundColor:'#ffffff', borderColor:'#e2e8f0', textStyle:{color:'#1e293b',fontSize:12}
    },
    grid:{ left:70, right:30, top:40, bottom:70 },
    xAxis: {
      type:'category', data:names, name:'操作员', nameLocation:'middle', nameGap:38,
      axisLabel:{ fontSize:11, rotate:30, interval:0 },
      axisLine:{ lineStyle:{ color:'#cbd5e1' } },
      axisTick:{ show:false }
    },
    yAxis: {
      type:'value', name:'节拍(s)', nameTextStyle:{ fontSize:12, color:'#64748b' },
      axisLabel:{ fontSize:11 }, splitLine:{ lineStyle:{ color:'#eef2f7' } }
    },
    series: [{
      name:'节拍(s)',
      type:'line',
      data:takts,
      symbol:'circle', symbolSize:8, connectNulls:false,
      itemStyle:{ color:'#2563eb' },
      lineStyle:{ color:'#93c5fd', width:2 },
      markPoint: {
        data:[{type:'max', name:'最高节拍'},{type:'min', name:'最低节拍'}],
        label:{ color:'#64748b', fontSize:10 }
      }
    }]
  };
  caChart.setOption(option);
  caChart.resize();
}

initChart();
searchProducts();
</script>
{% endblock %}
